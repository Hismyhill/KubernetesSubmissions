apiVersion: v1
kind: PersistentVolume
metadata:
  name: output-pv
spec:
  storageClassName: output-pv-claim
  capacity:
    storage: 1Gi
  accessModes:
    - ReadWriteMany
  local:
    path: /tmp/kube
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - k3d-k3s-default-agent-0
