apiVersion: apps/v1
kind: Deployment
metadata:
  name: ping-pong
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ping-pong
  template:
    metadata:
      labels:
        app: ping-pong
    spec:
      volumes:
        - name: output-volume
          persistentVolumeClaim:
            claimName: output-pvc
      containers:
        - name: ping-pong
          image: hismyhill/ping-pong:latest
          imagePullPolicy: IfNotPresent
          volumeMounts:
            - name: output-volume
              mountPath: /usr/share/app/files
