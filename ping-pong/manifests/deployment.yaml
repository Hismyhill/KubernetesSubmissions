apiVersion: apps/v1
kind: Deployment
metadata:
  name: ping-pong
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ping-pong
  template:
    metadata:
      labels:
        app: ping-pong
    spec:
      containers:
        - name: ping-pong
          image: hismyhill/ping-pong:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: PORT
              value: "3001" # Ensure this matches the targetPort in the service
