apiVersion: v1
kind: Service
metadata:
  name: todo-db-service
  namespace: project-ns
spec:
  ports:
    - port: 5432
      name: postgres
  clusterIP: None # Headless service for stable Pod DNS names
  selector:
    app: todo-db
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: todo-db
  namespace: project-ns
spec:
  serviceName: "todo-db-service"
  replicas: 1
  selector:
    matchLabels:
      app: todo-db
  template:
    metadata:
      labels:
        app: todo-db
    spec:
      containers:
        - name: postgres
          image: postgres:15
          env:
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: todo-app-config
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef:
                  name: todo-app-config
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: todo-app-secrets
                  key: POSTGRES_PASSWORD
          ports:
            - containerPort: 5432
              name: postgres
          volumeMounts:
            - name: todo-persistent-storage
              mountPath: /var/lib/postgresql # Adjusted to parent dir to prevent version 18+ upgrade mismatch issues
  volumeClaimTemplates:
    - metadata:
        name: todo-persistent-storage
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
