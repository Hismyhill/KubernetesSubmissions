apiVersion: apps/v1
kind: Deployment
metadata:
  name: todo-app
  namespace: project-ns
spec:
  replicas: 1
  selector:
    matchLabels:
      app: todo-app
  template:
    metadata:
      labels:
        app: todo-app
    spec:
      containers:
        - name: todo-app
          image: hismyhill/todo-app:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: todo-app-config
                  key: APP_PORT
            - name: BACKEND_URL
              valueFrom:
                configMapKeyRef:
                  name: todo-app-config
                  key: INTERNAL_FETCH_URL
            - name: CLIENT_POST_URL
              valueFrom:
                configMapKeyRef:
                  name: todo-app-config
                  key: BROWSER_POST_PATH
