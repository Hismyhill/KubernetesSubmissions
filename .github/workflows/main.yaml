name: Release application

on:
  push:

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: ${{ secrets.GKE_PROJECT }}
  GKE_CLUSTER: dwk-cluster
  GKE_ZONE: europe-north1-b
  REGISTRY: europe-north1-docker.pkg.dev
  REPOSITORY: my-repository
  IMAGE: todo-app
  SERVICE: todo-app
  BRANCH: ${{ github.ref_name }}

  # ...
jobs:
  build-publish-deploy:
    name: Build, Publish and Deploy
    runs-on: ubuntu-latest
    environment: GKE_PROJECT

    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: "${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}"
          service_account: "${{ secrets.SERVICE_ACCOUNT }}"

      - name: "Set up Cloud SDK"
        uses: google-github-actions/setup-gcloud@v3

      - name: "Use gcloud CLI"
        run: gcloud info
      # ...
      - run: gcloud --quiet auth configure-docker $REGISTRY
      # ...
      - name: "Get GKE credentials"
        uses: "google-github-actions/get-gke-credentials@v3"
        with:
          cluster_name: "${{ env.GKE_CLUSTER }}"
          project_id: "${{ env.PROJECT_ID }}"
          location: "${{ env.GKE_ZONE }}"

      - name: "Set up Docker Buildx"
        run: gcloud auth configure-docker "$REGISTRY"
      # ...
      - name: "Form the image name"
        run: echo "IMAGE_TAG=$REGISTRY/$PROJECT_ID/$REPOSITORY/$IMAGE:$BRANCH-$GITHUB_SHA" >> $GITHUB_ENV

      # ...
      - name: Build
        run: docker build -f todo-app/Dockerfile --tag $IMAGE_TAG todo-app/

      - name: Publish
        run: docker push $IMAGE_TAG

        # ...
      - name: Deploy
        run: |-
          cd todo-app

          # 1. Clean the GitHub Reference to get the raw branch name
          # (e.g., 'refs/heads/main' -> 'main', 'refs/heads/feature-login' -> 'feature-login')
          RAW_BRANCH="${GITHUB_REF#refs/heads/}"

          # 2. Enforce the environment routing conditional
          if [ "$RAW_BRANCH" = "main" ]; then
            TARGET_NAMESPACE="project"
          else
            # Assume your branches are named validly as per instructions
            TARGET_NAMESPACE="$RAW_BRANCH"
          fi

          echo "Targeting Environment Namespace: $TARGET_NAMESPACE"

          # 3. Create the isolated namespace if it doesn't already exist
          kubectl create namespace "$TARGET_NAMESPACE" || true

          # 4. Set the current kubectl context to point to this namespace
          kubectl config set-context --current --namespace="$TARGET_NAMESPACE"

          # 5. Inform Kustomize to update the target namespace manifests
          kustomize edit set namespace "$TARGET_NAMESPACE"
          kustomize edit set image TODO_APP_IMAGE=$IMAGE_TAG

          # 6. Build and apply manifests cleanly to the isolated target
          kustomize build . | kubectl apply -f - 

          # 7. Track the rollout status specifically inside the target environment
          kubectl rollout status deployment $SERVICE -n "$TARGET_NAMESPACE"
          kubectl get services -o wide -n "$TARGET_NAMESPACE"
