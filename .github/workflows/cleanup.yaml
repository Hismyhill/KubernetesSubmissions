name: Cleanup Branch Environment

on:
  delete:
    branches:
      - "**" # Triggers on the deletion of any branch
      - "!main" # Do not run if the main branch is deleted

permissions:
  contents: read
  id-token: write # Required for requesting the Google Cloud JWT

jobs:
  cleanup-environment:
    # Ensure this runs on branch deletion events
    if: github.event.ref_type == 'branch' && github.event.ref != 'main'
    runs-on: ubuntu-latest

    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: "${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}"
          service_account: "${{ secrets.SERVICE_ACCOUNT }}"

      - name: Set up GKE Credentials
        uses: google-github-actions/get-gke-credentials@v3
        with:
          cluster_name: "dwk-cluster"
          location: "europe-north1-b"

      - name: Delete Kubernetes Namespace
        run: |
          # The deleted branch name is provided directly by github.event.ref
          TARGET_NAMESPACE="${{ github.event.ref }}"

          echo "Deleting isolated environment namespace: $TARGET_NAMESPACE"

          # Delete the namespace; this automatically cleans up all pods, services, 
          # configmaps, and secrets nested inside it.
          kubectl delete namespace "$TARGET_NAMESPACE" --ignore-not-found=true
